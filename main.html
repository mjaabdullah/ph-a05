<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker | Assignment 5</title>
    <!-- daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- font awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- css style -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body class="bg-[#F8FAFC] min-h-screen">
    <nav class="bg-white shadow-sm">
      <div
        class="max-w-[1440px] mx-auto flex flex-col items-center gap-3 py-2 md:flex-row md:navbar"
      >
        <!-- left side -->
        <div class="flex-1">
          <div class="flex items-center gap-1">
            <img
              src="./assets/github-logo.png"
              alt="GitHub Issues Tracker"
              class="w-9 h-auto"
            />
            <h2 class="font-semibold text-2xl">GitHub Issues Tracker</h2>
          </div>
        </div>
        <!-- right side -->
        <div class="flex gap-2">
          <label class="input">
            <svg
              class="h-[1em] opacity-50"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2.5"
                fill="none"
                stroke="currentColor"
              >
                <circle cx="11" cy="11" r="8"></circle>
                <path d="m21 21-4.3-4.3"></path>
              </g>
            </svg>
            <input id="search-input" type="search" required placeholder="Search issues..." />
          </label>
          <button id="search-btn" class="btn btn-primary">Search</button>
        </div>
      </div>
    </nav>
    <!-- button section -->
    <section
      class="max-w-6xl mx-auto p-6 flex items-center gap-3 sm:flex-row flex-col bg-white rounded-lg shadow-sm my-6"
    >
      <button
        id="btn-all"
        class="btn btn-primary w-full sm:w-28"
        onclick="toggleActiveBtn(this)"
      >
        All
      </button>
      <button
        id="btn-open"
        class="btn w-full sm:w-28"
        onclick="toggleActiveBtn(this)"
      >
        Open
      </button>
      <button
        id="btn-closed"
        class="btn w-full sm:w-28"
        onclick="toggleActiveBtn(this)"
      >
        Closed
      </button>
    </section>

    <!-- issues section -->
    <section
      class="max-w-6xl mx-auto p-6 shadow-sm rounded-lg bg-white flex items-start sm:items-center justify-between flex-col sm:flex-row gap-4"
    >
      <!-- left -->
      <div class="flex justify-center items-center gap-2">
        <img src="./assets/Aperture.png" alt="Aperture" />
        <div>
          <h3 class="font-semibold text-xl"><span id="issues">00</span> Issues</h3>
          <p class="text-[#64748B]">Track and manage your project issues</p>
        </div>
      </div>
      <!-- right -->
      <div class="flex justify-center items-center gap-2">
        <div class="flex justify-center items-center gap-1">
          <img src="./assets/Open-Status.png" alt="Open Status" />
          Open
        </div>
        <div class="flex justify-center items-center gap-1">
          <img src="./assets/Closed- Status .png" alt="Closed Status" />
          Closed
        </div>
    </section>
    <section class="max-w-6xl mx-auto p-6 sm:p-0">
      <!-- Loading spinner -->
      <div id="loading-spinner" class="hidden text-center py-4">
        <span class="loading loading-spinner loading-xs"></span>
        <span class="loading loading-spinner loading-sm"></span>
        <span class="loading loading-spinner loading-md"></span>
        <span class="loading loading-spinner loading-lg"></span>
        <span class="loading loading-spinner loading-xl"></span>
      </div>
      <!-- issues Cards -->
      <div id="issues-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 items-center justify-center place-items-center my-4 ">
        <!-- Issue cards will be dynamically inserted here -->
         
      </div>
      <!-- modal  -->

<dialog id="my_modal_1" class="modal">
  
</dialog>
      
    </section>

    <script src="./js/main.js"></script>
  </body>
</html>
