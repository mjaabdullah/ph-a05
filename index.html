<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Issues Tracker | Assignment 5</title>

    <!-- daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- css style -->
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="bg-[#F8FAFC] min-h-screen flex items-center justify-center">
      <div class="bg-white max-w-lg sm:w-lg p-6 rounded-lg shadow-lg">
        <!-- Logo/Banner Section -->
        <div class="logo-section flex flex-col items-center gap-6 mb-6">
          <img src="./assets/github-logo.png" alt="github logo" />
          <div class="banner-title text-center">
            <h1 class="text-2xl font-semibold text-[#1F2937]">
              GitHub Issues Tracker
            </h1>
            <p class="text-[#64748B]">Sign in to manage your issues</p>
          </div>
        </div>

        <!-- Form Section -->

        <form class="form">
          <fieldset class="fieldset">
            <label class="label text-[#1F2937]">Username</label>
            <input
              type="text"
              class="input w-full"
              placeholder="Enter Username"
            />
            <span class="text-[#4A00FF] text-sm">Default: admin</span>
            <label class="label text-[#1F2937]">Password</label>
            <input
              type="password"
              class="input w-full"
              placeholder="Enter Password"
            />
            <span class="text-[#4A00FF] text-sm">Default: admin123</span>
            <button class="btn btn-primary mt-4">Login</button>
          </fieldset>
        </form>
        <!-- or section -->
        <div>
          <div class="text-center text-[#64748B] my-4 divider">OR</div>
          <p class="text-sm text-center">Demo Credentials:</p>
          <div
            class="bg-[#F8FAFC] flex flex-col items-center mt-2 py-6 rounded"
          >
            <span> <strong>Username:</strong> admin </span>
            <span> <strong>Password:</strong> admin123 </span>
          </div>
        </div>
      </div>
    </main>
    <script src="./js/app.js"></script>
  </body>
</html>
